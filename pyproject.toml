[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "quantos-decision-platform"
version = "0.1.0"
description = "Human-in-the-loop market analysis and decision-support platform"
requires-python = ">=3.12"
dependencies = [
  "binance-sdk-spot",
]

[project.scripts]
bstocks-scan = "bstocks_alpha.cli:main"
bstocks-stream = "bstocks_alpha.streaming:main"
bstocks-analyze = "bstocks_alpha.research:main"
bstocks-register-data = "bstocks_alpha.data_plane:main"

[project.optional-dependencies]
engine = [
  "nautilus_trader>=1,<2",
]
research-core = [
  "duckdb>=1.4,<2",
  "exchange_calendars>=4.13,<5",
  "numpy>=2,<3",
  "polars>=1.44,<2",
  "scipy>=1.15,<2",
  "skfolio>=1,<2",
]
research = [
  "duckdb>=1.0",
  "exchange_calendars>=4.13,<5",
  "numpy>=2,<3",
  "polars>=1.44,<2",
  "scipy>=1.15,<2",
  "pyarrow>=15",
  "vectorbt>=0.28",
  "skfolio>=1,<2",
]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quantos", "src/bstocks_alpha"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
